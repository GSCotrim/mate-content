  - slug: aula-11-guerra-fria
    title: Aula 11 — Guerra Fria
    description: O mundo bipolar, seus conflitos e o fim da União Soviética.
    tags: [historia-geral, guerra-fria]
    summary:
    - "A Guerra Fria (1947–1991) opôs EUA e URSS sem confronto militar direto."
    - "O mundo bipolar dividiu-se em OTAN e Pacto de Varsóvia, com a Cortina de Ferro."
    - "Houve corrida armamentista e espacial e conflitos como Coreia, Vietnã e a Crise dos Mísseis."
    - "O anticomunismo justificou ditaduras na América Latina, inclusive no Brasil (1964–1985)."
    - "Glasnost e perestroika levaram à queda do Muro (1989) e ao fim da URSS (1991)."
    blocks:
    - key: c1
      type: content
      markdownFile: historia-geral/aula-11-guerra-fria/01-para-comecar.md

    - key: c2
      type: content
      markdownFile: historia-geral/aula-11-guerra-fria/02-mundo-bipolar.md

    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: guerra-fria
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Moradores de Berlim protestaram contra a demolição de um trecho do muro que dividiu a cidade durante quase três décadas. Tratado como patrimônio cultural e histórico da cidade, o East Side Gallery, repleto de grafites emblemáticos, está na mira de uma construtora que pretende levantar um condomínio de luxo às margens do Rio Spree, que corta a cidade.

          *Alemães impedem demolição de último trecho original do muro de Berlim*. Disponível em: http://operamundi.uol.com.br. Acesso em: 2 fev. 2021 (adaptado).

          A demolição do símbolo histórico mencionado representa uma
        options:
        - text: "violação da memória coletiva."
          correct: true
        - text: "alteração das fronteiras políticas."
          correct: false
          feedback: "O muro já não é fronteira desde 1989; demoli-lo não altera fronteiras."
        - text: "adesão à arquitetura neoclássica."
          correct: false
          feedback: "O texto não trata de estilo arquitetônico."
        - text: "negação das influências orientais."
          correct: false
          feedback: "Não há referência a influências orientais."
        - text: "reorganização da mobilidade urbana."
          correct: false
          feedback: "A questão é a preservação do patrimônio, não o trânsito da cidade."
        explanation: |
          O trecho preservado do Muro de Berlim (East Side Gallery) é tratado como patrimônio histórico e cultural — registro material da divisão da cidade na Guerra Fria. Demoli-lo para erguer um condomínio significa apagar esse testemunho, ou seja, uma **violação da memória coletiva**. Resposta **(A)**.

