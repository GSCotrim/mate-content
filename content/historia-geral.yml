  - slug: aula-1-antiguidade-classica
    title: Aula 1 — Antiguidade Clássica (Grécia e Roma)
    description: Pólis e democracia grega, cultura clássica e a trajetória de Roma da República ao Império.
    tags: [historia-geral, antiguidade-classica]
    summary:
    - "A Grécia se organizava em póleis: Atenas (democracia direta e excludente) e Esparta (militarista)."
    - "A cultura grega criou a filosofia, o teatro e a explicação racional do mundo."
    - "Roma passou por Monarquia, República e Império, expandindo-se pelo Mediterrâneo."
    - "O legado romano inclui o direito, o latim, a engenharia e o cristianismo."
    - "A queda de Roma (476 d.C.) marca o fim da Idade Antiga."
    blocks:
    - key: c1
      type: content
      markdownFile: historia-geral/aula-1-antiguidade-classica/01-para-comecar.md

    - key: c2
      type: content
