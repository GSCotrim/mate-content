  - slug: aula-7-revolucoes-burguesas
    title: Aula 7 — Revoluções burguesas (Inglesa, Americana, Francesa)
    description: As revoluções que derrubaram o Antigo Regime e Napoleão.
    tags: [historia-geral, revolucoes-burguesas]
    summary:
    - "A Revolução Inglesa limitou o rei e criou a monarquia parlamentar."
    - "A Independência dos EUA (1776) adotou república, federalismo e Constituição escrita."
    - "A Revolução Francesa (1789) derrubou o Antigo Regime em nome de liberdade e igualdade."
    - "Napoleão consolidou conquistas (Código Civil) e seu bloqueio levou a corte portuguesa ao Brasil."
    - "As revoluções burguesas inauguraram o mundo contemporâneo e a ascensão da burguesia."
