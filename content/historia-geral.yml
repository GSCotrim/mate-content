    - "O mundo é multipolar: EUA, União Europeia, China e emergentes; surgem blocos econômicos."
    - "Os novos conflitos incluem disputas étnicas e o terrorismo internacional (11/9)."
    - "Os grandes desafios são a crise ambiental, a desigualdade, as migrações e a revolução digital."
