    tags: [historia-geral, revolucao-industrial]
    summary:
    - "A Revolução Industrial passou da produção artesanal à mecanizada, começando na Inglaterra."
    - "Capital, burguesia no poder, carvão, mão de obra e mercado colonial explicam o pioneirismo inglês."
    - "A industrialização teve fases marcadas por novas fontes de energia (vapor, eletricidade, eletrônica)."
    - "A urbanização trouxe jornadas longas, trabalho infantil e o nascimento do operariado."
    - "Surgiram o movimento operário e ideias críticas: socialismo, comunismo e anarquismo."
