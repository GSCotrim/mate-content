        suggestedSources: [ENEM, UNESP]

    - key: c4
      type: content
      markdownFile: historia-geral/aula-1-antiguidade-classica/04-roma.md

    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: antiguidade-classica
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Durante a realeza, e nos primeiros anos republicanos, as leis eram transmitidas oralmente de uma geração para outra. A ausência de uma legislação escrita permitia aos patrícios manipular a justiça conforme seus interesses.

          *A cidade antiga*. São Paulo: Martins Fontes, 2000.

          A conjuntura sociopolítica da Roma Antiga, conforme apresentada no texto, foi contestada pelos
        options:
        - text: "monarcas, que queriam expandir o código jurídico."
          correct: false
          feedback: "A monarquia já havia acabado; não eram os reis que contestavam a ordem."
        - text: "plebeus, que almejavam participar da vida política."
          correct: true
        - text: "nobres, que desejavam superar a relação de dependência."
          correct: false
          feedback: "Os patrícios (nobres) eram os beneficiados pela lei oral, não os contestadores."
        - text: "camponeses, que aspiravam diminuir a jornada de trabalho."
          correct: false
          feedback: "A reivindicação era por direitos e leis escritas, não por jornada de trabalho."
        - text: "estrangeiros, que ambicionavam acessar os espaços públicos."
          correct: false
          feedback: "O conflito era interno, entre patrícios e plebeus."
        explanation: |
          Com as leis apenas orais, os patrícios as manipulavam em proveito próprio. Foram os **plebeus** que contestaram essa situação, exigindo leis escritas e participação política — luta que levou, por exemplo, à Lei das Doze Tábuas. Resposta **(B)**.

    - key: c5
      type: content
      markdownFile: historia-geral/aula-1-antiguidade-classica/05-legado-e-crise.md

    - key: ph3
