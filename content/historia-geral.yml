  - slug: aula-9-seculo-xix
    title: Aula 9 — Século XIX (liberalismo, nacionalismo, imperialismo)
    description: As grandes forças do século XIX que moldaram o mundo contemporâneo.
    tags: [historia-geral, seculo-xix]
    summary:
    - "O Congresso de Viena (1815) tentou restaurar a velha ordem após Napoleão."
    - "O liberalismo defendia liberdades individuais (político) e livre mercado (econômico)."
    - "O nacionalismo levou às unificações da Itália (1870) e da Alemanha (1871)."
    - "O imperialismo dividiu a África e a Ásia em busca de matérias-primas e mercados."
    - "Nacionalismo e rivalidades imperialistas são raízes da Primeira Guerra Mundial."
