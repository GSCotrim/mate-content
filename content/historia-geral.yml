  - slug: aula-3-renascimento-reformas
    title: Aula 3 — Renascimento e Reformas religiosas
    description: Humanismo e Renascimento, a Reforma Protestante e a Contrarreforma católica.
    tags: [historia-geral, renascimento-reformas]
    summary:
    - "O Renascimento valorizou o ser humano (humanismo e antropocentrismo) e a razão."
    - "A ciência avançou com o heliocentrismo, e a prensa de Gutenberg difundiu ideias."
    - "Em 1517, Lutero rompeu com Roma: salvação pela fé e a Bíblia como autoridade."
    - "A Contrarreforma reagiu com o Concílio de Trento, os jesuítas e a Inquisição."
    - "A Europa ficou dividida religiosamente, o que influenciou a colonização da América."
