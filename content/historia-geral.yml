  - slug: aula-6-iluminismo
    title: Aula 6 — Iluminismo
    description: As ideias das Luzes, os principais pensadores e seus impactos políticos.
    tags: [historia-geral, iluminismo]
    summary:
    - "O Iluminismo confiava na razão e defendia liberdade, igualdade jurídica e tolerância."
    - "Montesquieu propôs a separação dos poderes; Rousseau, a soberania popular."
    - "Adam Smith defendeu o liberalismo econômico, em crítica ao Mercantilismo."
    - "As ideias iluministas inspiraram as independências e revoluções modernas."
    - "O Despotismo Esclarecido adotou reformas sem abrir mão do poder absoluto."
