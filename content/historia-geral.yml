  - slug: aula-5-absolutismo
    title: Aula 5 — Absolutismo
    description: A formação do Estado absolutista, suas teorias políticas e principais exemplos.
    tags: [historia-geral, absolutismo]
    summary:
    - "O Absolutismo concentrou o poder do Estado nas mãos do rei nas monarquias nacionais."
    - "Nobreza (privilégios) e burguesia (Estado forte) sustentavam o poder real."
    - "Teorias o justificavam: direito divino (Bossuet), Maquiavel e Hobbes."
    - "A França de Luís XIV (Versalhes) é o caso clássico; a Inglaterra seguiu outro caminho."
    - "Absolutismo e Mercantilismo se reforçavam: o Estado forte dirigia a economia."
