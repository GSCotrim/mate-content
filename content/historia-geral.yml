        difficulty: medium
        tags: [enem, idade-media]
        skill: "caracterizar o feudalismo (servidão, sociedade estamental, economia de subsistência) e distingui-lo da escravidão antiga"
        suggestedSources: [ENEM, FUVEST]

    - key: c3
