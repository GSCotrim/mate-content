  - slug: aula-4-navegacoes-mercantilismo
    title: Aula 4 — Grandes Navegações e Mercantilismo
    description: Expansão marítima europeia, Tratado de Tordesilhas, Mercantilismo e impactos globais.
    tags: [historia-geral, navegacoes-mercantilismo]
    summary:
    - "Especiarias, metais, bloqueio das rotas e avanços técnicos motivaram as navegações."
    - "Portugal (Vasco da Gama) e Espanha (Colombo) lideraram a expansão; Tordesilhas (1494) dividiu o mundo."
    - "O Mercantilismo buscava acumular metais com balança comercial favorável e protecionismo."
    - "O Pacto Colonial obrigava a colônia a comerciar só com a metrópole, em benefício dela."
    - "A expansão trouxe dominação indígena, tráfico de africanos e acúmulo de capital na Europa."
