    description: A Primeira Guerra, o período entreguerras, o totalitarismo e a Segunda Guerra.
    tags: [historia-geral, guerras-mundiais]
    summary:
    - "A Primeira Guerra (1914–1918) nasceu do imperialismo, do nacionalismo e das alianças militares."
    - "O Tratado de Versalhes puniu a Alemanha e alimentou o ressentimento que gerou o nazismo."
    - "O entreguerras teve a Revolução Russa (1917) e a Crise de 1929."
    - "O totalitarismo (fascismo e nazismo) levou à Segunda Guerra (1939–1945)."
    - "A guerra terminou com bombas atômicas, o Holocausto e a criação da ONU."
