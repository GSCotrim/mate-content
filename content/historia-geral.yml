      markdownFile: historia-geral/aula-1-antiguidade-classica/06-o-que-vimos.md

  - slug: aula-2-idade-media
    title: Aula 2 — Idade Média
    description: Feudalismo, o poder da Igreja, as Cruzadas e a crise do século XIV.
    tags: [historia-geral, idade-media]
    summary:
    - "O feudalismo tinha economia rural e de subsistência e uma sociedade estamental."
    - "Servidão e suserania-vassalagem organizavam as relações de produção e de poder."
    - "A Igreja Católica era a maior força espiritual, cultural, econômica e política."
    - "As Cruzadas reabriram o Mediterrâneo e impulsionaram o renascimento comercial e urbano."
    - "A crise do século XIV (fome, Peste Negra, guerras) enfraqueceu o feudalismo."
    blocks:
    - key: c1
      type: content
      markdownFile: historia-geral/aula-2-idade-media/01-para-comecar.md

    - key: c2
      type: content
