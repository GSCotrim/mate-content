        skill: "explicar as dimensões do poder da Igreja medieval e a visão teocêntrica de mundo"
        suggestedSources: [FUVEST, UNESP]

    - key: c4
      type: content
      markdownFile: historia-geral/aula-2-idade-media/04-cruzadas-renascimento-urbano.md

    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: idade-media
        source:
          exam: ENEM
          year: 2025
        prompt: |
          A difusão pelos cônegos do ideal apostólico, bem como a influência dos eremitas e dos pregadores errantes que na sua esteira propagavam temas evangélicos, contribuíram para fazer nascer, entre os fiéis, o desejo de se erguerem ao nível espiritual do clero e de obterem a sua salvação, sem que para isso tivessem de renunciar ao seu estado. Pela primeira vez, a Igreja entreabria as portas da graça em benefício da totalidade dos fiéis, colocando, como única condição, a sua partida para o Oriente, a fim de aí lutarem contra os inimigos de Cristo.

          *A espiritualidade da Idade Média Ocidental, séc. VIII-XIII*. Lisboa: Estampa, 1995.

          Conforme o texto, no imaginário dos fiéis cristãos do período medieval, a salvação era alcançada por meio das
        options:
        - text: "palavras escritas."
          correct: false
          feedback: "O texto enfatiza a ação de partir em peregrinação armada, não a leitura."
        - text: "práticas litúrgicas."
          correct: false
          feedback: "A condição posta não é o culto litúrgico, mas a ida ao Oriente."
        - text: "ações voluntárias."
          correct: true
        - text: "ideias messiânicas."
          correct: false
          feedback: "Não se trata de espera messiânica, e sim do engajamento pessoal na cruzada."
        - text: "celebrações coletivas."
          correct: false
          feedback: "A salvação é ligada à decisão individual de partir, não a celebrações."
        explanation: |
          O texto descreve a pregação que levou os fiéis a buscar a salvação tendo como "única condição" partir para o Oriente para lutar contra os inimigos de Cristo — isto é, engajar-se voluntariamente nas **Cruzadas**. A salvação seria alcançada por meio de **ações voluntárias** do próprio fiel. Resposta **(C)**.

    - key: c5
      type: content
      markdownFile: historia-geral/aula-2-idade-media/05-crise-baixa-idade-media.md

