        suggestedSources: [FUVEST, ENEM]

  - slug: aula-3-clima-vegetacao
    title: Aula 3 — Clima e vegetação do Brasil
    description: Fatores climáticos, massas de ar, tipos de clima e sua relação com a vegetação.
    tags: [geografia-brasil, clima-vegetacao]
    summary:
    - "Fatores (latitude, altitude, massas de ar, relevo, maritimidade) explicam a variação do clima; elementos são o que se mede."
    - "Cinco massas de ar comandam a dinâmica climática; suas frentes organizam as chuvas."
    - "Os climas vão do equatorial úmido ao semiárido e ao subtropical."
    - "O clima condiciona a vegetação natural, base para o estudo dos biomas."
