  - slug: aula-1-regionalizacao
    title: Aula 1 — Regionalização do Brasil
    description: As formas de dividir o território e o fio condutor das desigualdades regionais.
    tags: [geografia-brasil, regionalizacao]
    summary:
    - "Regionalizar é dividir o território segundo um critério escolhido — não há divisão única."
    - "O IBGE divide o país em 5 regiões respeitando limites estaduais, para fins estatísticos e administrativos."
    - "Os complexos regionais (Amazônia, Nordeste, Centro-Sul) seguem o processo de formação econômica."
    - "O contraste Centro-Sul × Norte/Nordeste expressa desigualdades historicamente construídas."
