    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: energia
        source:
          exam: ENEM
          year: 2025
        prompt: |
          **Pesquisa pioneira no Brasil propõe o uso de energia do solo para climatizar edifícios**

          Pela primeira vez na história, o Brasil terá um prédio que usa energia do solo para climatizar seus ambientes. Uma pesquisa inovadora avaliou o uso das fundações de edifícios como meio para a troca de energia térmica entre o prédio e o subsolo. A energia geotérmica é aquela encontrada dentro da crosta terrestre, seja no solo, nas rochas ou mesmo na água, sendo identificada pela temperatura. Essa energia pode ser transferida para a superfície por processos de troca térmica a partir das fundações da edificação.

          Disponível em: https://jornal.usp.br. Acesso em: 7 nov. 2021 (adaptado).

          Para o sistema elétrico brasileiro, a expansão de tecnologias como a descrita no texto representa uma tendência de
        options:
        - text: "homogeneização da oferta da matriz produtiva."
          correct: false
          feedback: "Acrescentar a geotérmica torna a matriz mais diversa, não mais homogênea."
        - text: "ampliação do consumo em unidades residenciais."
          correct: false
          feedback: "A tecnologia substitui parte do consumo elétrico de climatização — tende a reduzi-lo, não ampliá-lo."
        - text: "redução da pressão sobre as usinas hidrelétricas."
          correct: true
        - text: "estagnação do consumo em unidades industriais."
          correct: false
          feedback: "O texto trata da climatização de edifícios, não de estagnação industrial."
        - text: "superação da necessidade de recursos renováveis."
          correct: false
          feedback: "A geotérmica é ela própria uma fonte renovável; não supera a necessidade de renováveis."
        explanation: |
          A matriz elétrica brasileira depende fortemente das hidrelétricas, vulneráveis à falta de chuvas. Usar energia geotérmica para climatizar edifícios reduz o consumo de eletricidade da rede e, com isso, alivia a **pressão sobre as usinas hidrelétricas**, diversificando a matriz. Resposta **(C)**.

