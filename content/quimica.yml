  - slug: aula-11-eletroquimica
    title: Aula 11 — Eletroquímica
    description: Oxirredução e nox, pilhas, potenciais, eletrólise e aplicações.
    tags: [quimica, eletroquimica]
    summary:
    - "Oxirredução é transferência de elétrons, rastreada pelo nox."
    - "Oxidação perde elétrons (agente redutor); redução ganha (agente oxidante)."
    - "Pilha: reação espontânea gera corrente; ΔE° = E°(cátodo) − E°(ânodo) > 0."
    - "Eletrólise: a corrente força uma reação não espontânea (ígnea ou aquosa)."
