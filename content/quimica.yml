    - key: ex6
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: easy
        topic: atomos-tabela
        source:
          exam: FUVEST
        prompt: |
          O átomo constituído de 17 prótons, 18 nêutrons e 17 elétrons possui número atômico e número de massa iguais a:
        options:
        - text: "Z = 17 e A = 17"
          correct: false
          feedback: "A é a soma de prótons + nêutrons, não apenas os prótons."
        - text: "Z = 18 e A = 35"
          correct: false
          feedback: "Z é o nº de prótons (17), não de nêutrons."
        - text: "Z = 17 e A = 35"
          correct: true
        - text: "Z = 35 e A = 17"
          correct: false
        - text: "Z = 18 e A = 17"
          correct: false
        explanation: |
          **Z** = número de prótons = **17**. **A** = prótons + nêutrons = 17 + 18 = **35** (os elétrons não entram no número de massa). Resposta **(C)**.

    - key: ex7
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: atomos-tabela
        source:
          exam: Unitins
        prompt: |
          Com relação à classificação periódica moderna dos elementos, identifique a afirmação verdadeira:
        options:
        - text: "Em uma família, os elementos apresentam geralmente o mesmo número de elétrons na última camada."
          correct: true
        - text: "Na tabela periódica, os elementos estão em ordem decrescente de massas atômicas."
          correct: false
          feedback: "A ordem é crescente de número atômico (Z), não decrescente de massa."
        - text: "Em uma família, os elementos apresentam propriedades químicas bem distintas."
          correct: false
          feedback: "É o contrário: a mesma família tem propriedades semelhantes."
        - text: "Em um período, os elementos apresentam propriedades químicas semelhantes."
          correct: false
          feedback: "Propriedades semelhantes ocorrem na mesma família (coluna), não no mesmo período (linha)."
        - text: "Todos os elementos representativos pertencem ao grupo B da tabela periódica."
          correct: false
        explanation: |
          Elementos de uma mesma **família** (coluna) têm o mesmo número de elétrons na **camada de valência** — por isso têm propriedades químicas semelhantes. Resposta **(A)**.

