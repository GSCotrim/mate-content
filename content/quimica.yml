      markdownFile: quimica/aula-1-fundamentos/02-materia.md

    - key: c3
      type: content
      markdownFile: quimica/aula-1-fundamentos/03-substancias-e-misturas.md

    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: substancias-misturas
        source:
          exam: UFMG
        prompt: |
          Embora uma substância pura, como a água destilada, e uma mistura homogênea, como a água mineral, possam apresentar aspecto uniforme, a substância pura difere da mistura homogênea por:
        options:
        - text: "ser visualmente mais límpida."
          correct: false
          feedback: "Limpidez é aparência — as duas podem ser uniformes e límpidas. Não é isso que as distingue."
        - text: "apresentar maior afinidade química."
          correct: false
          feedback: "\"Afinidade química\" não é a propriedade que separa substância pura de mistura."
        - text: "apresentar constantes físicas definidas."
          correct: true
        - text: "apresentar maior interação entre as moléculas."
          correct: false
          feedback: "A intensidade das interações não é o critério — o que distingue são as constantes físicas."
        explanation: |
          Uma **substância pura** tem **constantes físicas definidas**: ponto de fusão e de ebulição fixos. Uma **mistura homogênea** funde e ferve em *faixas* de temperatura. Por isso a resposta é a **(C)** — é a constância das propriedades físicas que distingue a substância pura, não a aparência.

    - key: ex2
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: substancias-misturas
        source:
          exam: UEL — PR
        prompt: |
          Um rapaz pediu sua namorada em casamento, presenteando-a com uma aliança de ouro 18 quilates. Para comemorar, brindaram com água gaseificada com gelo, ao ar livre.

          Os sistemas **ouro 18 quilates**, **água gaseificada com gelo** e **ar atmosférico** são, respectivamente:
        options:
        - text: "substância heterogênea, mistura heterogênea e mistura homogênea."
          correct: false
        - text: "mistura heterogênea, mistura homogênea e substância homogênea."
          correct: false
        - text: "substância homogênea, mistura heterogênea e mistura homogênea."
          correct: false
          feedback: "Ouro 18 quilates não é substância — é uma liga, ou seja, uma mistura."
        - text: "mistura homogênea, mistura heterogênea e mistura homogênea."
          correct: true
        - text: "mistura heterogênea, substância homogênea e substância heterogênea."
          correct: false
        explanation: |
          **Ouro 18 quilates** é uma *liga metálica* → mistura **homogênea**. **Água gaseificada com gelo** tem várias fases (gelo sólido, água líquida, gás) → mistura **heterogênea**. O **ar atmosférico** é uma mistura **homogênea** de gases. Logo: homogênea, heterogênea, homogênea — alternativa **(D)**.

    - key: c4
      type: content
      markdownFile: quimica/aula-1-fundamentos/04-separacao-de-misturas.md

    - key: c5
      type: content
      markdownFile: quimica/aula-1-fundamentos/05-outros-metodos-de-separacao.md

    - key: ex3
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: separacao
        source:
          exam: ENEM
          year: 2020
        prompt: |
          As pilhas zinco-carbono têm um invólucro externo de aço (liga de ferro-carbono), um ânodo de zinco, um cátodo de grafita e um eletrólito em pasta. Na reciclagem, após a moagem, uma etapa separa o aço do invólucro dos demais componentes.

          Que processo aplicado à pilha moída permite obter essa separação?
        options:
        - text: "Catação manual"
          correct: false
        - text: "Ação de um eletroímã"
          correct: true
        - text: "Flotação"
          correct: false
        - text: "Dissolução em ácido"
          correct: false
        - text: "Centrifugação"
          correct: false
          feedback: "A centrifugação separa por densidade, não por magnetismo — não isola seletivamente o aço."
        explanation: |
          O **aço** é uma liga de **ferro**, material ferromagnético. Um **eletroímã** atrai e separa o invólucro de aço dos demais componentes (zinco e grafita), que não são magnéticos. Resposta **(B)**.

    - key: ex4
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: separacao
        source:
          exam: ENEM
          year: 2019
        prompt: |
          Sistemas de dessalinização da água do mar usam duas câmaras — uma com água doce e outra com água salgada — separadas por uma membrana semipermeável. Aplicando-se pressão na câmara com água salgada, a água pura é forçada a passar pela membrana para a câmara de água doce.

          O processo descrito para a purificação da água é denominado:
        options:
        - text: "filtração."
          correct: false
          feedback: "Filtração retém sólidos em suspensão — não separa sais dissolvidos."
        - text: "adsorção."
          correct: false
        - text: "destilação."
          correct: false
          feedback: "A destilação envolve mudança de estado por aquecimento — aqui não há aquecimento, e sim pressão."
        - text: "troca iônica."
          correct: false
        - text: "osmose reversa."
          correct: true
        explanation: |
          Aplicar **pressão** na água salgada para forçar a água pura através de uma **membrana semipermeável**, retendo os sais, é exatamente a **osmose reversa**. Resposta **(E)**.

    - key: ex5
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: easy
        topic: separacao
        source:
          exam: Vunesp
          year: 2020
        prompt: |
          Na preparação do café, a água quente entra em contato com o pó e é separada no coador.

          As operações envolvidas nessa separação são, respectivamente:
        options:
        - text: "destilação e decantação."
          correct: false
        - text: "filtração e destilação."
          correct: false
        - text: "destilação e coação."
          correct: false
        - text: "extração e filtração."
          correct: true
        - text: "extração e decantação."
          correct: false
          feedback: "A segunda etapa é o coador retendo o pó — isso é filtração, não decantação."
        explanation: |
          A água quente **extrai** as substâncias solúveis do pó (extração) e, em seguida, o coador **retém** o pó insolúvel deixando o líquido passar (filtração). Resposta **(D)**.

