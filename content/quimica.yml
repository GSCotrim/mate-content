  - slug: aula-9-termoquimica
    title: Aula 9 — Termoquímica
    description: Reações endo e exotérmicas, entalpia, Lei de Hess e entalpias de formação e combustão.
    tags: [quimica, termoquimica]
    summary:
    - "ΔH = H(produtos) − H(reagentes)."
    - "Exotérmica libera calor (ΔH < 0); endotérmica absorve (ΔH > 0)."
    - "Lei de Hess: o ΔH só depende dos estados inicial e final."
    - "Entalpia de formação (substância simples padrão = 0) e de combustão (exotérmica)."
