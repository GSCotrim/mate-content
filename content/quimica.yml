  - slug: aula-4-ligacoes
    title: Aula 4 — Ligações químicas
    description: Octeto, ligações iônica, covalente e metálica, geometria, polaridade e forças intermoleculares.
    tags: [quimica, ligacoes]
    summary:
    - "Os átomos se ligam buscando o octeto (estabilidade dos gases nobres)."
    - "Iônica: metal + ametal (transferência); covalente: ametais (compartilhamento); metálica: mar de elétrons."
