  - slug: aula-10-cinetica-equilibrio
    title: Aula 10 — Cinética e equilíbrio
    description: Velocidade e seus fatores, equilíbrio químico, Kc, Le Chatelier e equilíbrio iônico.
    tags: [quimica, cinetica-equilibrio]
    summary:
    - "A velocidade depende de temperatura, concentração, superfície de contato e catalisador."
    - "No equilíbrio dinâmico, as velocidades direta e inversa se igualam."
    - "Kc relaciona as concentrações e só muda com a temperatura."
    - "Le Chatelier: o sistema reage à perturbação minimizando-a."
    - "pH = −log[H⁺]; pH + pOH = 14; ácidos/bases fortes ionizam totalmente."
