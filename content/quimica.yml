  - slug: aula-1-fundamentos
    title: Aula 1 — Fundamentos da Química
    description: Matéria, substâncias, misturas, separação e átomos.
    tags: [quimica, materia]
    summary:
    - "Matéria é tudo que tem massa e ocupa espaço, em três estados físicos."
    - "Substâncias puras têm constantes físicas definidas; misturas, não."
    - "Cada técnica de separação explora uma propriedade dos componentes."
    - "O átomo tem prótons, nêutrons e elétrons; Z identifica o elemento e A = Z + N."
    - "A tabela periódica organiza os elementos em grupos e períodos."
    blocks:
    - key: c1
