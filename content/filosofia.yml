    tags: [filosofia, aristoteles]
    summary:
    - "Aristóteles parte do mundo concreto: a essência está nas próprias coisas, não num mundo separado."
    - "Sua lógica formaliza o raciocínio válido por meio do silogismo."
    - "A ética aristotélica é uma ética da virtude: a virtude é o justo meio entre dois excessos."
    - "O fim último da vida humana é a eudaimonia, a felicidade entendida como realização plena."
    - "O ser humano é um animal político; a vida boa só se realiza na pólis."
