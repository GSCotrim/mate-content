    - key: c4
      type: content
      markdownFile: filosofia/aula-8-empirismo/04-racionalismo-x-empirismo.md
    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: empirismo
        source:
          exam: ENEM
          year: 2025
        prompt: |
          A credulidade dos ouvintes aumenta o descaramento do narrador, e o descaramento deste conquista-lhes a credulidade. A eloquência, quando levada a seu patamar mais alto, deixa pouco lugar à razão ou à reflexão, mas, dirigindo-se inteiramente à imaginação e aos afetos, cativa os ouvintes condescendentes e subjuga-lhes o entendimento.

          HUME, D. *Uma investigação sobre o entendimento humano e sobre os princípios da moral*. São Paulo: Edunesp, 2003.

          No contexto do século XVIII, o autor propõe uma reflexão radical acerca da arte da eloquência, restringindo-a ao
        options:
        - text: "sistema de crenças, conforme a proposta kantiana de objetividade do conhecimento."
          correct: false
          feedback: "Kant é posterior a Hume e busca condições objetivas do conhecimento — o oposto da eloquência que apela aos afetos."
        - text: "campo dos absolutos, semelhante ao entendimento medieval dos Universais."
          correct: false
          feedback: "O debate medieval dos universais não tem relação com a crítica de Hume à eloquência."
        - text: "domínio da lógica, consoante a compreensão aristotélica nos Analíticos."
          correct: false
          feedback: "O texto diz exatamente o contrário: a eloquência \"deixa pouco lugar à razão ou à reflexão\", logo não se reduz à lógica."
        - text: "paradigma da racionalidade, alinhado ao modelo cartesiano de método."
          correct: false
          feedback: "A eloquência descrita dirige-se à imaginação e aos afetos, afastando-se da racionalidade metódica de Descartes."
        - text: "âmbito da persuasão, análogo às críticas platônicas aos sofistas."
          correct: true
        explanation: |
          Hume observa que a eloquência, no seu auge, **deixa pouco lugar à razão** e dirige-se **à imaginação e aos afetos** — ou seja, ela **persuade** sem **convencer** racionalmente. Ele a restringe, portanto, ao **âmbito da persuasão**. Isso retoma a crítica de **Platão aos sofistas**, que dominavam a arte de convencer (retórica) independentemente da verdade. Resposta **(E)**.
    - key: c5
      type: content
      markdownFile: filosofia/aula-8-empirismo/05-o-que-vimos.md

  - slug: aula-9-iluminismo
    title: Aula 9 — Iluminismo e razão crítica
    description: O uso público da razão, a crítica à tradição e o legado político do Esclarecimento.
    tags: [filosofia, iluminismo]
    summary:
    - "O Iluminismo defende o uso autônomo e público da razão como instrumento de emancipação."
