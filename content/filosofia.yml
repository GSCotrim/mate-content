    title: Aula 1 — O que é Filosofia e a passagem do mito ao logos
    description: O nascimento da Filosofia na Grécia, a atitude filosófica e a diferença entre mito e razão.
    tags: [filosofia, introducao-filosofia]
    summary:
    - "Filosofia é a busca racional, crítica e argumentada por respostas a problemas fundamentais."
    - "O mito explica o mundo por narrativas; o logos busca explicações racionais e universais."
    - "A admiração (thauma) e a dúvida são as origens da atitude filosófica."
    - "A Filosofia nasce na Grécia do século VI a.C. e organiza-se em grandes áreas (metafísica, ética, política, lógica, estética)."
    - "No ENEM, a Filosofia aparece aplicada a debates atuais sobre ética, política e conhecimento."
