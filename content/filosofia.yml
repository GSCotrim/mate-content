  - slug: aula-11-etica-kant-utilitarismo
    title: "Aula 11 — Ética e moral: Kant e o utilitarismo"
    description: A ética do dever de Kant e a ética das consequências do utilitarismo.
    tags: [filosofia, etica-moral]
    summary:
    - "Ética é a reflexão filosófica sobre a moral, o conjunto de valores e normas de uma sociedade."
    - "A ética de Kant é deontológica: o valor moral está no dever e na boa vontade, não nas consequências."
    - "O imperativo categórico exige agir segundo máximas que possam ser universalizadas."
    - "O utilitarismo é consequencialista: a ação correta é a que maximiza o bem-estar do maior número."
    - "Deontologia e utilitarismo oferecem critérios distintos para avaliar dilemas éticos atuais."
