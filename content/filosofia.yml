    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: filosofia-contemporanea
        source:
          exam: ENEM
          year: 2025
        prompt: |
          A "invenção" dessa nova anatomia política não deve ser entendida como uma descoberta súbita. Mas como uma multiplicidade de processos muitas vezes mínimos, de origens diferentes, de localizações esparsas, que se recordam, que se repetem, ou se imitam, apoiam-se uns sobre os outros e esboçam aos poucos a fachada de um método geral. Encontramo-los em funcionamento nos colégios, muito cedo; mais tarde, nas escolas primárias, no espaço hospitalar e na organização militar.

          FOUCAULT, M. *Vigiar e punir*. Petrópolis: Vozes, 2011.

          O texto indica o seguinte aspecto da disciplina como ferramenta política:
        options:
        - text: "Expansão das técnicas de suplício."
          correct: false
          feedback: "Foucault contrapõe a disciplina ao suplício; o poder disciplinar não amplia o castigo físico."
        - text: "Judicialização das relações de poder."
          correct: false
          feedback: "A disciplina opera fora dos tribunais — em escolas, hospitais e quartéis."
        - text: "Dissolução das distinções de nobreza."
          correct: false
          feedback: "O texto não trata de hierarquias nobiliárquicas."
        - text: "Capilarização das práticas de controle."
          correct: true
        - text: "Espetacularização das medidas de penitência."
          correct: false
          feedback: "A disciplina é discreta e difusa, o oposto do castigo como espetáculo público."
        explanation: |
          Foucault descreve o poder disciplinar como uma multiplicidade de processos mínimos e dispersos que se espalham por colégios, escolas, hospitais e quartéis. Trata-se da **capilarização das práticas de controle** — um poder que penetra de forma difusa em todo o tecido social. Resposta **(D)**.
    - key: c5
      type: content
      markdownFile: filosofia/aula-12-filosofia-contemporanea/05-o-que-vimos.md
