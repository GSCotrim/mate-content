  - slug: aula-3-socrates-e-sofistas
    title: Aula 3 — Sócrates e os sofistas
    description: O giro antropológico, o relativismo sofista e o método socrático.
    tags: [filosofia, socrates-sofistas]
    summary:
    - "Os sofistas deslocaram a Filosofia da natureza para o ser humano e a vida em sociedade."
    - "O relativismo (Protágoras) afirma que não há verdade absoluta, e a retórica ensina a persuadir."
    - "Sócrates buscava definições universais e o autoconhecimento, opondo-se ao relativismo."
    - "O método socrático combina ironia (refutar o falso saber) e maiêutica (fazer nascer o conceito)."
    - "Sócrates ligou virtude e conhecimento: agir bem depende de saber o que é o bem (intelectualismo moral)."
