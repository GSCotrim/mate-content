  - slug: aula-8-empirismo
    title: Aula 8 — O empirismo
    description: A experiência como origem do conhecimento em Locke e Hume.
    tags: [filosofia, empirismo]
    summary:
    - "O empirismo afirma que todo conhecimento tem origem na experiência sensível."
    - "Locke recusa as ideias inatas: a mente nasce como uma tábula rasa preenchida pela experiência."
    - "Hume distingue impressões e ideias e analisa criticamente a noção de causalidade."
    - "A crítica de Hume à causalidade mostra os limites do conhecimento empírico (ceticismo)."
    - "Racionalismo e empirismo dividem-se sobre a fonte do conhecimento: razão ou experiência."
