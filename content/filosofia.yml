  - slug: aula-4-platao
    title: Aula 4 — Platão e o mundo das ideias
    description: A teoria das ideias, o dualismo entre sensível e inteligível e a teoria política.
    tags: [filosofia, platao]
    summary:
    - "Platão distingue o mundo sensível (cópias mutáveis) do mundo inteligível das Ideias (Formas) perfeitas e eternas."
    - "O conhecimento verdadeiro (episteme) é das Ideias; a opinião (doxa) fica presa às aparências."
    - "A alegoria da caverna ilustra a passagem da ignorância ao conhecimento e o papel do filósofo."
    - "Para Platão, a alma é tripartida e a justiça é a harmonia entre suas partes."
    - "Na política, Platão propõe a cidade justa governada pelos filósofos (o rei-filósofo)."
    blocks:
    - key: c1
      type: content
      markdownFile: filosofia/aula-4-platao/01-para-comecar.md
