    tags: [filosofia, racionalismo]
    summary:
    - "A modernidade desloca o fundamento do conhecimento de Deus para o sujeito que pensa."
    - "Descartes usa a dúvida metódica para encontrar uma verdade indubitável."
    - "O cogito (penso, logo existo) é a primeira certeza, base de todo o conhecimento."
    - "Para o racionalismo, a razão, e não os sentidos, é a fonte segura do saber."
    - "Descartes inaugura o problema moderno entre sujeito e objeto (res cogitans e res extensa)."
