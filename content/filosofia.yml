    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: etica-moral
        source:
          exam: ENEM
          year: 2025
        prompt: |
          A missão dos governantes consiste em promover a felicidade da sociedade, punindo e recompensando. A parte da missão de governo que consiste em punir constitui mais particularmente o objeto da lei penal. A obrigatoriedade ou necessidade de punir uma ação é proporcional à medida que tal ação tende a perturbar a felicidade e à medida que a tendência do referido ato é perniciosa. A felicidade consiste naquilo que já vimos, ou seja, em desfrutar prazeres e em estar isento de dores.

          BENTHAM, J. *Uma introdução aos princípios da moral e da legislação*. São Paulo: Abril Cultural, 1974 (adaptado).

          Qual perspectiva de justiça emerge da relação, estabelecida no texto, entre punição e felicidade?
        options:
        - text: "Aplicação de meios para atingir um fim."
          correct: true
        - text: "Imposição de regras para estabelecer um dever."
          correct: false
          feedback: "Justiça como dever é a perspectiva deontológica (Kant), oposta ao raciocínio consequencialista do texto."
        - text: "Sobreposição de princípios para fundamentar um direito."
          correct: false
          feedback: "O texto não fundamenta a punição em princípios ou direitos, mas em seus efeitos sobre a felicidade."
        - text: "Criação de parâmetros para reconhecer uma prescrição."
          correct: false
          feedback: "A punição não decorre de uma prescrição prévia, e sim do cálculo de suas consequências."
        - text: "Elaboração de convenções para referendar um costume."
          correct: false
          feedback: "Não há apelo a costumes ou convenções: o critério é a maximização da felicidade."
        explanation: |
          O texto é de **Bentham**, fundador do **utilitarismo**, uma ética **consequencialista**: uma ação é correta conforme suas **consequências** para a felicidade (prazer e ausência de dor). A punição é justificada como **meio** para o **fim** de preservar a felicidade da sociedade, e sua intensidade é proporcional ao dano que o ato causa. Trata-se, portanto, de uma justiça que aplica **meios para atingir um fim**. Resposta **(A)**.
    - key: c5
      type: content
      markdownFile: filosofia/aula-11-etica-kant-utilitarismo/05-o-que-vimos.md

