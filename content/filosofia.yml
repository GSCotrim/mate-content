    - key: c4
      type: content
      markdownFile: filosofia/aula-4-platao/04-alma-e-politica.md
    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: platao
        source:
          exam: ENEM
          year: 2025
        prompt: |
          A cidade justa é governada pelos filósofos, administrada pelos cientistas, protegida pelos guerreiros e mantida pelos produtores. Cada classe cumprirá sua função para o bem da pólis, racionalmente dirigida pelos filósofos. Em contrapartida, a cidade injusta é aquela onde o governo está nas mãos dos proprietários — que não pensam no bem comum da pólis e lutarão por interesses econômicos particulares.

          CHAUÍ, M. *Convite à filosofia*. São Paulo: Ática, 2000.

          O texto apresenta a estrutura de governo da cidade ideal pensada por Platão, que postula uma indissociabilidade entre
        options:
        - text: "cognoscência e relação intersubjetiva."
          correct: false
          feedback: "O texto não trata da construção do conhecimento entre sujeitos, mas de quem deve governar e por quê."
        - text: "mitologia e teorias cosmogônicas."
          correct: false
          feedback: "A cidade justa de Platão se funda na razão filosófica, não em explicações mitológicas sobre a origem do mundo."
        - text: "cidadania e primazia da retórica."
          correct: false
          feedback: "Platão desconfia da retórica (associada aos sofistas); o governo cabe a quem conhece o bem, não a quem persuade."
        - text: "moralidade e virtudes cardeais."
          correct: false
          feedback: "Embora Platão trabalhe com virtudes, o texto enfatiza quem governa e o porquê — o saber que liga ética e poder —, não as quatro virtudes cardeais."
        - text: "ética e exercício do poder."
          correct: true
        explanation: |
          Para Platão, a cidade só é **justa** quando governada pelos **filósofos** — aqueles que conhecem o **bem**. O poder não pode estar dissociado do saber ético: governa bem quem sabe o que é o bem comum. A **cidade injusta** é justamente aquela em que o poder se separa da ética (cai nas mãos dos proprietários, movidos por interesses particulares). Logo, Platão postula a **indissociabilidade entre ética e exercício do poder** — a base da ideia do **rei-filósofo**. Resposta **(E)**.
    - key: c5
      type: content
      markdownFile: filosofia/aula-4-platao/05-o-que-vimos.md

