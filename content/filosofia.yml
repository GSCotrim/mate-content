    - "Na patrística, Agostinho reinterpreta Platão e defende a iluminação divina e o livre-arbítrio."
    - "Na escolástica, Tomás de Aquino reinterpreta Aristóteles e harmoniza fé e razão."
    - "Tomás propõe vias racionais para demonstrar a existência de Deus e a noção de lei natural."
    - "O período prepara as discussões modernas sobre conhecimento, vontade e moral."
