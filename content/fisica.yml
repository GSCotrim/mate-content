  - slug: aula-6-termologia-calorimetria
    title: Aula 6 — Termologia e calorimetria
    description: Temperatura e calor, escalas, calor sensível e latente, dilatação e propagação.
    tags: [fisica, termologia]
    summary:
    - "Temperatura mede agitação; calor é energia em trânsito do quente para o frio."
    - "Escalas: T_K = T_C + 273; Celsius, Fahrenheit e Kelvin."
    - "Calor sensível (Q = m·c·ΔT) muda a temperatura; latente (Q = m·L) muda o estado."
    - "Em sistema isolado, a soma dos calores trocados é nula (Σ Q = 0)."
    - "Dilatação (ΔL = L₀·α·ΔT) e três formas de propagação: condução, convecção e irradiação."
