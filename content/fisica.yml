  - slug: aula-5-hidrostatica
    title: Aula 5 — Hidrostática
    description: Pressão, Teorema de Stevin, Princípio de Pascal e empuxo de Arquimedes.
    tags: [fisica, hidrostatica]
    summary:
    - "Pressão: p = F/A; densidade d = m/V decide a flutuação."
    - "Teorema de Stevin: p = p₀ + d·g·h; a pressão cresce com a profundidade."
    - "Princípio de Pascal: a pressão se transmite integralmente (prensa hidráulica)."
    - "Princípio de Arquimedes: empuxo E = d_fluido·V_imerso·g."
    - "Comparar empuxo e peso decide se o corpo flutua, equilibra ou afunda."
    blocks:
