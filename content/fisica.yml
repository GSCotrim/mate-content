  - slug: aula-11-eletrodinamica-circuitos
    title: Aula 11 — Eletrodinâmica e circuitos
    description: Corrente, resistência, Lei de Ohm, associações, potência e consumo de energia.
    tags: [fisica, eletrodinamica]
    summary:
    - "Corrente: i = Q/Δt, em ampères; mantida pela ddp da fonte."
    - "Lei de Ohm: U = R·i; resistência do fio R = ρ·L/A."
    - "Série: mesma corrente, R_eq é a soma (resistência maior)."
    - "Paralelo: mesma tensão, 1/R_eq é a soma dos inversos (resistência menor)."
    - "Potência P = U·i = R·i² = U²/R (efeito Joule); consumo E = P·Δt em kWh."
