  - slug: aula-4-impulso-quantidade-movimento
    title: Aula 4 — Impulso e quantidade de movimento
    description: Quantidade de movimento, impulso, sua conservação e colisões.
    tags: [fisica, impulso-momento]
    summary:
    - "Quantidade de movimento: Q = m·v, grandeza vetorial."
    - "Impulso: I = F·Δt, igual à área sob o gráfico força × tempo."
    - "Teorema do impulso: I = ΔQ — base de airbags e cintos de segurança."
    - "Sem força externa resultante, a quantidade de movimento total se conserva."
    - "Colisões sempre conservam momento; só as elásticas conservam energia cinética."
