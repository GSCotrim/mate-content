  - slug: aula-1-cinematica
    title: Aula 1 — Cinemática
    description: Movimento, MRU e MRUV, queda livre e movimentos em duas dimensões.
    tags: [fisica, cinematica]
    summary:
    - "O movimento é relativo: depende do referencial; deslocamento é vetor, distância é escalar."
    - "No MRU a velocidade é constante; no MRUV a aceleração é constante."
    - "As três equações do MRUV, incluindo a de Torricelli, resolvem a maioria dos problemas."
    - "Queda livre e lançamento vertical são MRUV com a = g ≈ 10 m/s²."
    - "Movimentos 2D se decompõem; no MCU há aceleração centrípeta a = v²/R."
    blocks:
