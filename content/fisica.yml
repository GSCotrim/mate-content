  - slug: aula-13-fisica-moderna
    title: Aula 13 — Física moderna
    description: Quantização, efeito fotoelétrico, dualidade, relatividade e radioatividade.
    tags: [fisica, fisica-moderna]
    summary:
    - "Planck: a luz vem em pacotes — fótons com E = h·f."
    - "Efeito fotoelétrico: a luz arranca elétrons se a frequência for alta o bastante."
    - "Dualidade onda-partícula: luz e matéria têm natureza dupla."
    - "Relatividade: c é constante; dilatação do tempo, contração do comprimento e E = m·c²."
    - "Radioatividade: emissões α, β e γ; meia-vida, datação por C-14 e medicina nuclear."
