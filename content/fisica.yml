  - slug: aula-9-ondas-acustica
    title: Aula 9 — Ondas e acústica
    description: Tipos de onda, grandezas, fenômenos ondulatórios e a física do som.
    tags: [fisica, ondas]
    summary:
    - "Ondas transportam energia, não matéria; mecânicas × eletromagnéticas, transversais × longitudinais."
    - "Equação fundamental: v = λ·f; num mesmo meio a velocidade é constante."
    - "Fenômenos: reflexão, refração, difração, interferência e ondas estacionárias."
    - "A polarização só ocorre em ondas transversais — distingue luz de som."
    - "O som é mecânico e longitudinal; altura, intensidade, timbre e Efeito Doppler."
