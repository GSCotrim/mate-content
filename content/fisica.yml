  - slug: aula-3-trabalho-energia
    title: Aula 3 — Trabalho, energia e potência
    description: Trabalho, potência, formas de energia mecânica e sua conservação.
    tags: [fisica, trabalho-energia]
    summary:
    - "Trabalho: τ = F·d·cos θ — positivo, negativo ou nulo (força perpendicular)."
    - "Potência mede a rapidez do trabalho: P = τ/Δt = F·v."
    - "Energias mecânicas: cinética (m·v²/2), potencial gravitacional (m·g·h) e elástica (k·x²/2)."
    - "O teorema trabalho-energia cinética liga o trabalho da resultante à variação de Ec."
    - "Sem dissipação a energia mecânica se conserva; com atrito, parte vira calor."
