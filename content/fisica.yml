  - slug: aula-2-dinamica
    title: Aula 2 — Dinâmica (Leis de Newton)
    description: As três leis de Newton, forças comuns e suas aplicações.
    tags: [fisica, dinamica]
    summary:
    - "1ª Lei: sem força resultante, o corpo mantém repouso ou MRU (inércia)."
    - "2ª Lei: F_resultante = m·a — a força é a causa da aceleração."
    - "3ª Lei: ação e reação são iguais, opostas e atuam em corpos diferentes."
    - "Peso, normal, tração e atrito (Fat = μ·N) são as forças mais comuns."
    - "O diagrama de corpo livre e F = m·a resolvem plano inclinado, sistemas ligados e elevadores."
    blocks:
    - key: c1
      type: content
      markdownFile: fisica/aula-2-dinamica/01-para-comecar.md

