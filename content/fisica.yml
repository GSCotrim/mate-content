  - slug: aula-10-eletrostatica
    title: Aula 10 — Eletrostática
    description: Carga elétrica, eletrização, Lei de Coulomb, campo e potencial elétrico.
    tags: [fisica, eletrostatica]
    summary:
    - "Carga elétrica tem dois sinais; iguais se repelem, opostas se atraem; é quantizada e conservada."
    - "Eletrização por atrito, contato e indução."
    - "Lei de Coulomb: F = k·Q₁·Q₂/d², variando com 1/d²."
    - "Campo elétrico E = F/q = k·Q/d²; linhas saem do + e chegam ao −."
    - "Potencial V = k·Q/d (varia com 1/d); a ddp impulsiona as cargas e τ = q·U."
