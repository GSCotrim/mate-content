  - slug: aula-7-termodinamica-gases
    title: Aula 7 — Termodinâmica e gases
    description: Gases ideais, transformações, 1ª e 2ª Leis e máquinas térmicas.
    tags: [fisica, termodinamica]
    summary:
    - "Gás ideal: p·V = n·R·T, com T em kelvin; Lei Geral dos Gases."
    - "Transformações: isotérmica (Boyle), isobárica (Charles) e isovolumétrica."
    - "1ª Lei: Q = ΔU + τ — conservação da energia, com convenções de sinais."
    - "2ª Lei: é impossível converter todo calor em trabalho; a entropia cresce."
    - "Máquinas térmicas: η = 1 − Q_frio/Q_quente; Carnot fixa o rendimento máximo."
