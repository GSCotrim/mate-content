  - slug: aula-12-eletromagnetismo
    title: Aula 12 — Eletromagnetismo
    description: Ímãs, campo magnético, força magnética e indução eletromagnética.
    tags: [fisica, eletromagnetismo]
    summary:
    - "Ímãs têm dois polos inseparáveis; linhas de B saem do norte e entram no sul."
    - "Oersted: corrente cria campo magnético; bobina = eletroímã."
    - "Força magnética: F = q·v·B·sen θ e F = B·i·L·sen θ; é perpendicular à velocidade."
    - "Indução de Faraday: ε = −ΔΦ/Δt — campo variável gera corrente."
    - "Lei de Lenz: a corrente induzida se opõe à variação; geradores e transformadores."
