  - slug: aula-8-optica-geometrica
    title: Aula 8 — Óptica geométrica
    description: Reflexão e espelhos, refração e lentes, e os defeitos da visão.
    tags: [fisica, optica]
    summary:
    - "Reflexão: ângulo de reflexão igual ao de incidência; espelho plano dá imagem virtual e igual."
    - "Espelhos esféricos: côncavo converge, convexo diverge; vale 1/f = 1/p + 1/p'."
    - "Refração: n = c/v e Lei de Snell (n₁·sen θ₁ = n₂·sen θ₂)."
    - "Reflexão total acima do ângulo limite — princípio das fibras ópticas."
    - "Lentes: convergente corrige hipermetropia, divergente corrige miopia; P = 1/f em dioptrias."
    blocks:
