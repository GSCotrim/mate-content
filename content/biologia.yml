  - slug: aula-3-metabolismo-celular
    title: Aula 3 — Metabolismo celular
    description: ATP, fotossíntese, respiração celular aeróbia e fermentação.
    tags: [biologia, metabolismo-celular]
    summary:
    - "O ATP é a moeda energética da célula."
    - "A fotossíntese (cloroplastos) produz glicose e O₂ usando luz, CO₂ e água."
    - "A respiração aeróbia (mitocôndrias) quebra a glicose com O₂ em três etapas, gerando muito ATP."
    - "A fermentação é anaeróbia, rende pouco ATP e tem usos industriais."
