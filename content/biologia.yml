  - slug: aula-5-histologia
    title: Aula 5 — Histologia
    description: "Os quatro tecidos animais: epitelial, conjuntivo, muscular e nervoso."
    tags: [biologia, histologia]
    summary:
    - "Tecido é um conjunto de células semelhantes com função comum."
    - "Epitelial reveste e secreta; conjuntivo tem muita matriz (inclui o sangue)."
    - "Muscular se contrai (esquelético, cardíaco, liso); nervoso conduz impulsos."
    - "A histologia é a ponte entre a célula e a fisiologia dos órgãos."
