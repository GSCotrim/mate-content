  - slug: aula-1-origem-da-vida
    title: Aula 1 — Origem da vida e introdução à Biologia
    description: Características dos seres vivos, níveis de organização, origem da vida e bioquímica.
    tags: [biologia, origem-vida]
    summary:
    - "A vida se define por um conjunto de características: célula, metabolismo, reprodução, hereditariedade e evolução."
    - "Os níveis de organização vão do átomo à biosfera."
    - "A biogênese substituiu a abiogênese; a evolução química explica as primeiras moléculas orgânicas."
    - "Água, sais e moléculas orgânicas (com as enzimas) compõem os seres vivos."
