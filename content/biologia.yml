    title: Aula 13 — Saúde e doenças
    description: Agentes de doenças, transmissão, prevenção, saúde pública e doenças crônicas.
    tags: [biologia, saude]
    summary:
    - "Patógenos: vírus, bactérias, protozoários, fungos e vermes; só bacterianas respondem a antibióticos."
