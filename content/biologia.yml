  - slug: aula-6-fisiologia-i
    title: Aula 6 — Fisiologia humana I
    description: Sistemas digestório, respiratório e circulatório.
    tags: [biologia, fisiologia]
    summary:
    - "O digestório faz digestão mecânica e química; o intestino delgado é o centro da absorção."
    - "O respiratório ventila os pulmões e realiza a hematose nos alvéolos."
    - "O circulatório é uma dupla circulação (pulmonar e sistêmica), com coração de quatro câmaras."
    - "Artéria leva sangue do coração; veia o traz de volta."
