  - slug: aula-8-genetica
    title: Aula 8 — Genética
    description: Conceitos, leis de Mendel, heranças especiais, DNA, RNA e mutações.
    tags: [biologia, genetica]
    summary:
    - "Genótipo é a constituição genética; fenótipo, a característica observável."
    - "1ª Lei de Mendel dá 3:1 no fenótipo; a 2ª Lei dá 9:3:3:1."
    - "Há heranças além de Mendel: codominância, alelos múltiplos (ABO) e ligada ao sexo."
    - "O DNA é uma dupla-hélice (A-T, C-G) que vira proteína por transcrição e tradução."
    - "Mutações alteram o DNA e são a fonte primária de variabilidade."
    blocks:
