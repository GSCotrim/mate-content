  - slug: aula-11-ecologia
    title: Aula 11 — Ecologia
    description: Cadeias, ciclos, relações, biomas, desequilíbrios ambientais e sustentabilidade.
    tags: [biologia, ecologia]
    summary:
    - "Hierarquia: população → comunidade → ecossistema → biosfera; cada espécie tem nicho."
    - "A energia flui em sentido único e cai ~10% por nível; a matéria é reciclada nos ciclos."
    - "As relações ecológicas (harmônicas e desarmônicas) regulam as populações."
    - "Os biomas brasileiros têm traços e ameaças próprios."
    - "Desequilíbrios: aquecimento global, poluição, eutrofização e perda de biodiversidade."
