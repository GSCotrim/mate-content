  - slug: aula-2-citologia
    title: Aula 2 — Citologia
    description: Teoria celular, procariontes e eucariontes, membrana, transporte e organelas.
    tags: [biologia, citologia]
    summary:
    - "A célula é a unidade da vida e vem sempre de outra célula (Teoria Celular)."
    - "Procariontes não têm núcleo organizado; eucariontes têm núcleo e organelas membranosas."
    - "A membrana é seletiva; o transporte é passivo (difusão, osmose) ou ativo (com ATP)."
    - "Cada organela tem uma função; a teoria endossimbiótica explica mitocôndrias e cloroplastos."
    blocks:
