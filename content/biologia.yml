  - slug: aula-7-fisiologia-ii
    title: Aula 7 — Fisiologia humana II
    description: Sistemas nervoso, endócrino, imunológico e excretor.
    tags: [biologia, fisiologia]
    summary:
    - "O nervoso é rápido e elétrico; a sinapse usa neurotransmissores."
    - "O endócrino é químico e regulado por feedback negativo (insulina e glucagon na glicemia)."
    - "O imunológico tem defesa inata e adquirida; vacina é imunização ativa, soro é passiva."
    - "O excretor filtra o sangue no néfron, mantendo a homeostase."
