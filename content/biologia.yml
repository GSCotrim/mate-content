  - slug: aula-10-evolucao
    title: Aula 10 — Evolução
    description: Lamarck, Darwin, teoria sintética, evidências e especiação.
    tags: [biologia, evolucao]
    summary:
    - "Lamarck propôs a mudança das espécies, mas a herança dos caracteres adquiridos está superada."
    - "Darwin explicou a mudança pela seleção natural."
    - "A teoria sintética une Darwin à genética (mutação, recombinação, deriva, migração)."
    - "Evidências: fósseis, órgãos homólogos × análogos e semelhanças bioquímicas."
    - "A especiação decorre do isolamento e leva ao isolamento reprodutivo."
