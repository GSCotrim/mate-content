  - slug: aula-4-divisao-celular
    title: Aula 4 — Divisão celular
    description: Ciclo celular, mitose, meiose e a origem da variabilidade.
    tags: [biologia, divisao-celular]
    summary:
    - "O ciclo celular alterna intérfase (com duplicação do DNA) e divisão."
    - "A mitose gera duas células idênticas (2n), para crescimento e reparo."
    - "A meiose gera quatro células haploides (n), os gametas."
    - "Crossing-over e segregação independente produzem variabilidade genética."
