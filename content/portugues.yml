  - slug: aula-5-funcoes-da-linguagem
    title: Aula 5 — Funções da linguagem
    description: As seis funções de Jakobson e como reconhecê-las pela ênfase do texto.
    tags: [portugues, funcoes-linguagem]
    summary:
    - "Cada função destaca um elemento da comunicação (emissor, receptor, mensagem etc.)."
    - "Referencial informa; emotiva expressa o emissor; conativa apela ao receptor."
    - "Fática testa o canal; metalinguística fala da própria linguagem; poética foca a forma da mensagem."
    - "Um texto costuma misturar funções, com uma predominante."
    - "Identificar a função predominante revela a intenção comunicativa do texto."
