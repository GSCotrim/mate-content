  - slug: aula-9-variacao-linguistica
    title: Aula 9 — Variação linguística e preconceito linguístico
    description: As variedades da língua, os tipos de variação e a crítica ao preconceito linguístico.
    tags: [portugues, variacao-linguistica]
    summary:
    - "A língua varia no espaço, no tempo, no grupo social e na situação de uso."
    - "Nenhuma variedade é errada: cada uma é adequada (ou não) ao contexto."
    - "Norma-padrão é uma variedade de prestígio, não a única forma correta."
    - "Adequação linguística é escolher o registro certo para a situação."
    - "Preconceito linguístico julga o falante pela variedade que usa — e o ENEM o critica."
