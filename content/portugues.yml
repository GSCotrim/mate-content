  - slug: aula-7-genero-dissertativo-argumentativo
    title: Aula 7 — O texto dissertativo-argumentativo
    description: Tese, argumentos, estratégias argumentativas e estrutura da argumentação.
    tags: [portugues, generos-textuais]
    summary:
    - "O texto dissertativo-argumentativo defende um ponto de vista com argumentos."
    - "Estrutura: introdução (tese), desenvolvimento (argumentos) e conclusão (proposta/síntese)."
    - "Argumentos de autoridade, exemplificação, causa/consequência e dados sustentam a tese."
    - "Fato é verificável; opinião é avaliação — separá-los é essencial na leitura crítica."
    - "Esse é o gênero da redação do ENEM e de muitos textos de prova."
