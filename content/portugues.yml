  - slug: aula-6-generos-narrativos
    title: Aula 6 — Gêneros textuais e o texto narrativo
    description: O conceito de gênero, tipos textuais e a estrutura da narrativa.
    tags: [portugues, generos-textuais]
    summary:
    - "Gênero textual é uma forma social de uso da língua, com função e suporte próprios."
    - "Tipos textuais (narração, descrição, dissertação, injunção) compõem os gêneros."
    - "A narrativa organiza fatos no tempo: enredo, personagens, narrador, espaço."
    - "O foco narrativo (1ª ou 3ª pessoa) determina o ponto de vista da história."
    - "Reconhecer o gênero orienta as expectativas de leitura."
