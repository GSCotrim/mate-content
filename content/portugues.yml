  - slug: aula-1-competencia-leitora
    title: Aula 1 — Competência leitora e interpretação
    description: Ler além das linhas — compreensão, interpretação e inferência.
    tags: [portugues, interpretacao]
    summary:
    - "Compreender é extrair o que o texto diz; interpretar é ir além, com base no texto."
    - "A inferência preenche o não dito a partir de pistas textuais e do contexto."
    - "Tema e tese organizam a leitura: do assunto geral ao ponto de vista defendido."
    - "Pressuposto e subentendido carregam sentidos implícitos no texto."
    - "Extrapolar sem apoio no texto é o erro mais comum em prova."
