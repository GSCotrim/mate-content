  - slug: aula-4-coesao-coerencia
    title: Aula 4 — Coesão e coerência
    description: Como as partes do texto se conectam (coesão) e fazem sentido juntas (coerência).
    tags: [portugues, coesao-coerencia]
    summary:
    - "Coesão é a amarração entre as partes; coerência é o sentido lógico do todo."
    - "A coesão referencial usa pronomes, sinônimos e elipses para retomar termos."
    - "Conectivos sinalizam relações: causa, oposição, conclusão, adição, tempo."
    - "Um texto pode ser coeso e incoerente, ou coerente apesar de falhas de coesão."
    - "Trocar o conectivo muda a relação lógica e, com ela, o sentido do período."
