  - slug: aula-2-denotacao-conotacao
    title: Aula 2 — Denotação e conotação
    description: Sentido literal e sentido figurado, e como o texto sinaliza cada um.
    tags: [portugues, denotacao-conotacao]
    summary:
    - "Denotação é o sentido literal, de dicionário; conotação é o sentido figurado, contextual."
    - "O mesmo termo muda de sentido conforme o gênero e o contexto de uso."
    - "Textos científicos e jornalísticos tendem ao denotativo; literários e publicitários, ao conotativo."
    - "Captar a conotação é condição para entender ironia, humor e crítica."
    - "Trocar denotação por conotação (ou o contrário) muda toda a interpretação."
