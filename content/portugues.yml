  - slug: aula-10-intertextualidade
    title: Aula 10 — Intertextualidade
    description: "O diálogo entre textos: citação, alusão, paródia, paráfrase e referência."
    tags: [portugues, intertextualidade]
    summary:
    - "Intertextualidade é o diálogo de um texto com outros textos."
    - "Citação e alusão trazem o texto-fonte de forma explícita ou indireta."
    - "Paráfrase reafirma o sentido; paródia subverte com humor ou crítica."
    - "Reconhecer o texto-fonte é condição para entender o sentido do novo texto."
    - "A intertextualidade é frequente em charges, propagandas e literatura no ENEM."
    blocks:
