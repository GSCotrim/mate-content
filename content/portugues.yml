  - slug: aula-3-figuras-de-linguagem
    title: Aula 3 — Figuras de linguagem
    description: Metáfora, metonímia, ironia, hipérbole e outras figuras como recursos de sentido.
    tags: [portugues, figuras-linguagem]
    summary:
    - "Figuras de linguagem são desvios intencionais que ampliam ou intensificam o sentido."
    - "Figuras de palavra: metáfora, metonímia, comparação, catacrese, sinestesia."
    - "Figuras de pensamento: ironia, hipérbole, eufemismo, antítese, paradoxo, personificação."
    - "Figuras de sintaxe: elipse, pleonasmo, anáfora, hipérbato, polissíndeto."
    - "No ENEM, a figura nunca é fim em si: importa o efeito de sentido que ela cria."
