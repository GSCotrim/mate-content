  - slug: aula-8-generos-midiaticos
    title: "Aula 8 — Gêneros midiáticos: propaganda e charge"
    description: Texto publicitário, charge e cartum como gêneros de leitura crítica no ENEM.
    tags: [portugues, generos-textuais]
    summary:
    - "A propaganda articula linguagem verbal e visual para persuadir."
    - "Recursos persuasivos: apelo emocional, imperativo, jogos de palavras, autoridade."
    - "A charge é um gênero de opinião que critica fatos atuais com humor e ironia."
    - "Ler charge exige reconhecer o contexto (referente) a que ela alude."
    - "Propaganda e charge cobram leitura crítica, não decoração de regras."
