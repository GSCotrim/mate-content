  - slug: aula-5-trabalho-e-sociedade
    title: Aula 5 — Trabalho e sociedade
    description: Divisão do trabalho, taylorismo/fordismo/toyotismo, informalidade, desemprego e uberização.
    tags: [sociologia, trabalho-sociedade]
    summary:
    - "Trabalho transforma a natureza e a sociedade; é central na Sociologia desde os clássicos."
    - "Divisão do trabalho social (especialização) e técnica (tarefas fatiadas), e desigual."
    - "Taylorismo, fordismo e toyotismo: formas históricas de organizar a produção."
    - "Formal x informal, desemprego (inclusive estrutural) e precarização marcam o Brasil."
    - "Uberização: trabalho por plataformas sem direitos, sob aparência de autonomia."
    blocks:
    - key: c1
      type: content
      markdownFile: sociologia/aula-5-trabalho-e-sociedade/01-para-comecar.md

    - key: c2
      type: content
      markdownFile: sociologia/aula-5-trabalho-e-sociedade/02-divisao-do-trabalho.md

    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: trabalho-sociedade
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Adam Smith via o açougueiro e o padeiro não só como indivíduos buscando seus interesses financeiros, mas como pessoas moralmente motivadas dentro de uma sociedade. A base da moral era a empatia e o julgamento, instaurando uma distinção entre o que queremos fazer e o que sentimos que devemos fazer.

          *O futuro do capitalismo*. Porto Alegre: L&PM, 2019.

          O texto defende uma motivação capitalista para o campo dos negócios, na qual o lucro se mostra associado à
        options:
        - text: "consolidação do poder político."
          correct: false
          feedback: "O texto trata da motivação moral nos negócios, não de poder político."
        - text: "procura de satisfação subjetiva."
          correct: false
          feedback: "A ênfase está na empatia e no dever para com a sociedade, não na satisfação pessoal."
        - text: "estruturação do monopólio comercial."
          correct: false
          feedback: "Não há menção a monopólio; trata-se da dimensão moral da ação econômica."
        - text: "percepção de responsabilidade ética."
          correct: true
        - text: "conquista do reconhecimento público."
          correct: false
          feedback: "O critério apresentado é interno (empatia e dever), não a busca por reconhecimento."
        explanation: |
          O texto retoma a dimensão moral de Adam Smith: o agente econômico não age só pelo interesse financeiro, mas movido pela empatia e pelo senso do que "devemos fazer". O lucro, assim, aparece associado a uma **percepção de responsabilidade ética** para com a sociedade. Resposta **(D)**.

