    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: cultura-sociedade
        source:
          exam: ENEM
          year: 2025
        prompt: |
          **TEXTO I**

          A partir do século IV, com os imperadores ditos cristãos, o teatro e a dança foram condenados. O batismo era recusado aos que atuavam no circo ou na pantomima. E em 398, no Concílio de Cartago, os que iam ao teatro nos dias santos foram excomungados.

          DINIZ, T. et al. *História da dança*. Disponível em: www.uel.br. Acesso em: 18 out. 2023.

          **TEXTO II**

          A dança no ato litúrgico cumpre tanto um papel de adoração quanto mercadológico. Não à toa há aceitação, expansão e investimento nessa prática percebida massivamente pela ampla divulgação principalmente nas redes sociais. A expansão e ampliação por via de festivais, aulas, cursos, palestras etc. consolida a criação de um mercado específico para esse público.

          *Dança gospel*. Salvador: UFBA, 2021.

          A percepção sobre a dança e a cultura corporal apresenta aspectos relacionados, respectivamente, a
        options:
        - text: "segregação social e intolerância eclesiástica."
          correct: false
          feedback: "O TEXTO I trata de condenação religiosa, não de segregação social."
        - text: "rituais eucarísticos e sacramentos da Igreja."
          correct: false
          feedback: "Nenhum dos textos trata de eucaristia ou de sacramentos."
        - text: "transe individual e progresso intelectual."
          correct: false
          feedback: "Os textos não mencionam transe nem progresso intelectual."
        - text: "penitência pessoal e juramento coletivo."
          correct: false
          feedback: "Não há penitência nem juramento nos textos."
        - text: "dogmatismo religioso e adesão de fiéis."
          correct: true
        explanation: |
          No TEXTO I, a Igreja antiga condena e excomunga quem pratica ou assiste à dança e ao teatro — uma postura de **dogmatismo religioso**. No TEXTO II, a dança gospel é aceita e expandida como adoração e mercado, ligada à **adesão de fiéis**. Respectivamente: dogmatismo religioso e adesão de fiéis. Resposta **(E)**.

    - key: c4
      type: content
      markdownFile: sociologia/aula-3-cultura-e-sociedade/04-identidade-e-diversidade-cultural.md

    - key: c5
      type: content
      markdownFile: sociologia/aula-3-cultura-e-sociedade/05-industria-cultural.md

    - key: ex2
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: cultura-sociedade
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Independência de pensamento, autonomia e direito à oposição política estão perdendo sua função crítica básica numa sociedade que parece cada vez mais capaz de atender às necessidades dos indivíduos através da forma pela qual é organizada. Nas condições de um padrão de vida crescente, o não conformismo com o próprio sistema parece socialmente inútil, principalmente quando acarreta desvantagens econômicas e políticas tangíveis e ameaça o funcionamento suave do todo.

          MARCUSE, H. *Ideologia da sociedade industrial*. Rio de Janeiro: Zahar, 1969.

          Qual é a característica da sociedade industrial do século XX apresentada no texto?
        options:
        - text: "Gestão integrada."
          correct: false
          feedback: "O texto não trata de um modelo de gestão, e sim da perda da crítica."
        - text: "Relativismo moral."
          correct: false
          feedback: "A questão é a anulação da oposição, não a relativização de valores morais."
        - text: "Desobediência civil."
          correct: false
          feedback: "O texto descreve o contrário: o conformismo e a aparente inutilidade do não conformismo."
        - text: "Realidade unidimensional."
          correct: true
        - text: "Desenvolvimento tecnológico."
          correct: false
          feedback: "A tecnologia é pano de fundo; o ponto é a supressão do pensamento crítico."
        explanation: |
          Marcuse descreve uma sociedade que, ao atender ao consumo e elevar o padrão de vida, absorve e neutraliza a crítica: o não conformismo torna-se "socialmente inútil". É a **realidade unidimensional** — uma sociedade que perde a dimensão da negação e da oposição. Resposta **(D)**.

