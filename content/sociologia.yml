  - slug: aula-3-cultura-e-sociedade
    title: Aula 3 — Cultura e sociedade
    description: Conceito de cultura, etnocentrismo, identidade, indústria cultural e multiculturalismo.
    tags: [sociologia, cultura-sociedade]
    summary:
    - "Cultura é tudo o que se cria, aprende e transmite em sociedade; é simbólica e mutável."
    - "Etnocentrismo julga o outro pela própria cultura; o relativismo a compreende em sua lógica."
    - "A identidade cultural é construída, múltipla e relacional (diversidade brasileira)."
    - "Indústria cultural (Adorno e Horkheimer): cultura como mercadoria padronizada."
    - "Multiculturalismo: a convivência respeitosa entre culturas; assimilação x integração."
