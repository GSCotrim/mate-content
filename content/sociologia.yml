    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: globalizacao
        source:
          exam: ENEM
          year: 2025
        prompt: |
          **Sinal fechado**

          Olá, como vai? / Eu vou indo e você, tudo bem? / Tudo bem, eu vou indo, correndo / Pegar meu lugar no futuro, e você? / Tudo bem, eu vou indo em busca / De um sono tranquilo, quem sabe? / Quanto tempo... / Pois é, quanto tempo... / Me perdoe a pressa / É a alma dos nossos negócios... / Oh, não tem de quê / Eu também só ando a cem / Quando é que você telefona? / Precisamos nos ver por aí / Pra semana, prometo, / Talvez nos vejamos, quem sabe? / [...] / Por favor, telefone, eu preciso beber / Alguma coisa rapidamente / Pra semana... / O sinal... / Eu procuro você... / Prometo, não esqueço / Por favor, não esqueça / Não esqueço, não esqueço / Adeus...

          DA VIOLA, P. *Foi um rio que passou em minha vida*. Rio de Janeiro: Odeon, 1970.

          A letra da canção apresenta a permanência de uma situação da vida cotidiana ao destacar a
        options:
        - text: "diminuição do comportamento competitivo."
          correct: false
          feedback: "Todos estão 'correndo' e 'a cem'; a pressa e a competição permanecem, não diminuem."
        - text: "importância da memória coletiva."
          correct: false
          feedback: "A música fala de esquecimento e pressa individual, não de memória coletiva."
        - text: "redução da mobilidade urbana."
          correct: false
          feedback: "Os personagens estão em deslocamento apressado constante; não há redução da mobilidade."
        - text: "efemeridade dos vínculos de afetividade."
          correct: true
        - text: "obsolescência dos meios de comunicação."
          correct: false
          feedback: "Telefone e encontros são citados como meios ainda usados, embora sempre adiados."
        explanation: |
          O diálogo apressado entre dois conhecidos que se reencontram no sinal — com promessas vagas de "telefonar" e "se ver pra semana" — retrata relações superficiais e passageiras típicas da vida urbana moderna. A permanência dessa cena cotidiana está na **efemeridade dos vínculos de afetividade**. Resposta **(D)**.

    - key: c4
      type: content
      markdownFile: sociologia/aula-10-globalizacao-e-sociedade-contemporanea/04-contradicoes-da-globalizacao.md

    - key: ex2
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: globalizacao
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Para que a utopia nasça, é preciso duas condições. A primeira é a forte sensação de que o mundo não está funcionando adequadamente e deve ter seus fundamentos revistos para que se reajuste. A segunda condição é a existência de uma confiança no potencial humano à altura da tarefa de reformar o mundo, a crença de que nós, seres humanos, podemos fazê-lo, sendo capazes de perceber o que está errado com o mundo, o que precisa ser modificado, quais são os pontos problemáticos, e ter força e coragem para extirpá-los.

          BAUMAN, Z. *Revista Cult*, jan. 2017.

          De acordo com o autor, qual é a função da utopia no contexto das transformações sociais?
        options:
        - text: "Habilitar memórias afetivas."
          correct: false
          feedback: "A utopia volta-se ao futuro a ser reformado, não às memórias do passado."
        - text: "Apontar alternativas possíveis."
          correct: true
        - text: "Legitimar experiências pretéritas."
          correct: false
          feedback: "A utopia critica o presente e projeta o novo; não legitima o passado."
        - text: "Perpetuar paradigmas científicos."
          correct: false
          feedback: "O texto fala em rever fundamentos, não em perpetuar paradigmas."
        - text: "Empreender soluções conclusivas."
          correct: false
          feedback: "A utopia aponta caminhos possíveis, não soluções definitivas e fechadas."
        explanation: |
          Para Bauman, a utopia nasce da percepção de que o mundo precisa ser reformado somada à confiança no potencial humano de transformá-lo. Sua função é justamente **apontar alternativas possíveis** — imaginar um mundo melhor que oriente a mudança social. Resposta **(B)**.

