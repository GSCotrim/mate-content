  - slug: aula-2-classicos
    title: Aula 2 — Os clássicos da Sociologia
    description: Durkheim (fato social), Weber (ação social) e Marx (classes e trabalho).
    tags: [sociologia, classicos]
    summary:
    - "Durkheim: o fato social é externo, coercitivo e geral; foco na coesão e na anomia."
    - "Weber: a ação social tem sentido; racionalização, burocracia e tipos de dominação."
    - "Marx: classes definidas pelos meios de produção; mais-valia, alienação e luta de classes."
    - "Os três oferecem lentes distintas: ordem, sentido e conflito."
