    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: identidade-diversidade
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Fragmentada em pequenos grupos, fragilizada pela ausência de algum tipo de organização ampla, tendo que carregar o peso do preconceito racial que se transfere do negro para a cultura negra, a religião dos orixás tem poucas chances de se sair melhor na competição — desigual — com outras religiões. Silenciosamente, assistimos hoje a um verdadeiro massacre das religiões afro-brasileiras.

          *O Brasil com axé*. Estudos Avançados, n. 52, dez. 2004.

          No processo de invisibilização dos cultos afro-brasileiros, o texto associa os seguintes elementos essenciais:
        options:
        - text: "Ausência de soluções partidárias e rejeição da laicidade."
          correct: false
          feedback: "O texto não fala em partidos nem em defesa da laicidade."
        - text: "Precariedade de coesão representativa e recusa da alteridade."
          correct: true
        - text: "Insuficiência de estruturas decisórias e exclusão da dialogicidade."
          correct: false
          feedback: "O foco é a fragmentação e o preconceito racial, não estruturas decisórias formais."
        - text: "Inexistência de direitos constitucionais e negação do ecumenismo."
          correct: false
          feedback: "Não se trata da ausência de direitos formais nem de ecumenismo."
        - text: "Efemeridade das relações políticas e debilidade do pertencimento étnico."
          correct: false
          feedback: "O texto afirma o peso do preconceito racial, não a debilidade do pertencimento."
        explanation: |
          O texto aponta dois elementos: a fragmentação em pequenos grupos sem organização ampla (**precariedade de coesão representativa**) e o preconceito racial transferido à cultura negra (**recusa da alteridade**). Juntos, explicam a invisibilização e o "massacre" das religiões afro-brasileiras. Resposta **(B)**.

