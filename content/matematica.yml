  - slug: aula-4-funcao-quadratica
    title: Aula 4 — Função quadrática
    description: Função do 2º grau, raízes por Bhaskara, discriminante, parábola, concavidade e vértice.
    tags: [matematica, funcao-quadratica]
    summary:
    - "Função quadrática: f(x) = ax² + bx + c, gráfico em parábola."
    - "Raízes por Bhaskara; o Δ diz se há duas, uma ou nenhuma raiz real."
    - "a>0 abre para cima (mínimo); a<0 abre para baixo (máximo)."
    - "Vértice: x_v = −b/2a, y_v = −Δ/4a — o ponto de máximo ou mínimo."
    - "O vértice resolve problemas de otimização (altura, lucro, área máximos)."
