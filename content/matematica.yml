  - slug: aula-6-sequencias-pa-pg
    title: "Aula 6 — Sequências: PA e PG"
    description: Progressões aritmética e geométrica, termo geral e soma dos termos.
    tags: [matematica, sequencias]
    summary:
    - "Sequência com padrão regular tem fórmula para qualquer termo."
    - "PA soma a razão r: aₙ = a₁ + (n−1)r; soma Sₙ = (a₁ + aₙ)n/2."
    - "PG multiplica pela razão q: aₙ = a₁·q^(n−1); soma Sₙ = a₁(qⁿ−1)/(q−1)."
    - "A PA é a versão discreta da função afim; a PG, da exponencial."
    - "A PG modela juros compostos, depreciação e meia-vida."
    blocks:
    - key: c1
      type: content
      markdownFile: matematica/aula-6-sequencias-pa-pg/01-para-comecar.md

