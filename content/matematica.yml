  - slug: aula-10-trigonometria
    title: Aula 10 — Trigonometria
    description: Razões trigonométricas no triângulo retângulo, ângulos notáveis e o ciclo trigonométrico.
    tags: [matematica, trigonometria]
    summary:
    - "Seno, cosseno e tangente relacionam ângulos e lados (SOH-CAH-TOA)."
    - "As razões dependem só do ângulo — medem alturas e distâncias inacessíveis."
    - "Ângulos notáveis 30°, 45°, 60° e a relação sen²θ + cos²θ = 1."
    - "O ciclo trigonométrico estende seno e cosseno a qualquer ângulo; 180° = π rad."
    - "As funções seno e cosseno são periódicas e modelam fenômenos cíclicos."
    blocks:
