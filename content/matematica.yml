  - slug: aula-9-geometria-espacial
    title: Aula 9 — Geometria espacial
    description: Volumes de prismas, cilindros, pirâmides, cones e esferas; volume e capacidade.
    tags: [matematica, geometria-espacial]
    summary:
    - "Prismas e cilindros: V = A_base × h; cilindro V = πr²h."
    - "Pirâmides e cones: V = (1/3)·A_base·h — um terço do sólido reto correspondente."
    - "Esfera: V = (4/3)πr³, área 4πr²."
    - "Capacidade: 1 L = 1 dm³, 1 m³ = 1000 L; unidades cúbicas mudam de mil em mil."
    - "O deslocamento de líquido mede o volume de um corpo submerso."
