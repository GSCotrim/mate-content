  - slug: aula-1-conjuntos-numericos
    title: Aula 1 — Conjuntos numéricos e operações
    description: Naturais a reais, frações, decimais, potências, raízes e notação científica.
    tags: [matematica, conjuntos-numericos]
    summary:
    - "Os conjuntos numéricos se ampliam: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ."
    - "Racionais são frações/dízimas; irracionais são decimais infinitos não periódicos."
    - "Frações e decimais se convertem; porcentagem é fração de 100."
    - "Potências e raízes têm propriedades operatórias fixas."
    - "A notação científica representa grandezas muito grandes ou pequenas."
