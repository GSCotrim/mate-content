  - slug: aula-3-funcao-afim
    title: Aula 3 — Funções e função afim
    description: Conceito de função, domínio e imagem, função do 1º grau, gráfico, coeficientes e raiz.
    tags: [matematica, funcao-afim]
    summary:
    - "Função associa a cada entrada x uma única saída f(x); domínio e imagem."
    - "Função afim: f(x) = ax + b, gráfico em reta."
    - "a é a taxa (a>0 cresce, a<0 decresce); b é o valor inicial."
    - "A raiz é x = −b/a, onde a reta corta o eixo x."
    - "A taxa de variação é constante — marca da função do 1º grau."
