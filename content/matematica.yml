  - slug: aula-7-equacoes-inequacoes-sistemas
    title: Aula 7 — Equações, inequações e sistemas
    description: Equações do 1º e 2º grau, inequações e sistemas lineares e sua interpretação geométrica.
    tags: [matematica, equacoes-inequacoes]
    summary:
    - "Equação do 1º grau: x = −b/a; do 2º grau: Bhaskara ou casos incompletos."
    - "Inequação tem solução em intervalo; multiplicar por negativo inverte o sinal."
    - "A inequação do 2º grau exige o estudo do sinal da parábola."
    - "Sistemas: substituição ou adição; geometricamente, o encontro de retas."
    - "Um sistema pode ter uma, nenhuma ou infinitas soluções."
