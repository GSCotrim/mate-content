  - slug: aula-2-razao-proporcao-porcentagem
    title: Aula 2 — Razão, proporção e porcentagem
    description: Razões, proporções, regra de três simples e composta, porcentagem e fator de multiplicação.
    tags: [matematica, razao-proporcao]
    summary:
    - "Razão compara dois valores; proporção iguala duas razões (meios × extremos)."
    - "Regra de três resolve proporções; distinguir grandezas diretas de inversas é o passo-chave."
    - "Porcentagem é razão de 100, calculada multiplicando pelo decimal."
    - "Fator de multiplicação: ×(1 + p/100) para aumento, ×(1 − p/100) para desconto."
    - "Acréscimos e descontos sucessivos se multiplicam, nunca se somam."
