  - slug: aula-5-exponencial-logaritmo
    title: Aula 5 — Função exponencial e logaritmo
    description: Função exponencial, gráfico, equações exponenciais, logaritmo e suas propriedades.
    tags: [matematica, funcao-exponencial]
    summary:
    - "Função exponencial: f(x) = aˣ; a>1 cresce, 0<a<1 decresce."
    - "O gráfico passa por (0,1), é sempre positivo e tem o eixo x como assíntota."
    - "Equações exponenciais: igualar as bases para igualar os expoentes."
    - "Logaritmo é o inverso da exponencial: log_a b = x ⟺ aˣ = b."
    - "As propriedades do log transformam produto em soma; pH, Richter e decibéis são logarítmicos."
