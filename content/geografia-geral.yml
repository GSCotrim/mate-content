    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: hard
        topic: hidrografia
        source:
          exam: ENEM
          year: 2025
        prompt: |
          Por séculos, o Rio Reno tem sido uma rota de navegação confiável, ajudando a criar gigantes fabris ao longo de suas margens. No entanto, esses dias parecem estar no fim, pois o nível da água tem diminuído regularmente, o que impede a navegação fluvial do final do verão até o outono. Isso mostra como a crise climática atinge as economias dos países ricos.

          Disponível em: www.estadao.com.br. Acesso em: 10 ago. 2023 (adaptado).

          Qual é o efeito econômico do problema ambiental apresentado no texto?
        options:
        - text: "Supressão da extração de minério."
          correct: false
          feedback: "O texto trata de navegação fluvial, não de mineração."
        - text: "Intensificação da atividade de pesca."
          correct: false
          feedback: "A queda do nível da água prejudica os usos do rio; não há ganho para a pesca no texto."
        - text: "Encarecimento da logística de transporte."
          correct: true
        - text: "Inviabilização da agricultura de subsistência."
          correct: false
          feedback: "O Reno é via de transporte industrial; o texto não fala de agricultura de subsistência."
        - text: "Sucateamento da indústria de transformação."
          correct: false
          feedback: "As fábricas não são sucateadas; o problema é o escoamento da produção encarecer."
        explanation: |
          O Reno é uma hidrovia que abastece a indústria europeia. Com o nível da água baixo, a navegação fica impedida e as cargas precisam migrar para modais mais caros (rodoviário e ferroviário), elevando o custo do frete. O efeito econômico é o **encarecimento da logística de transporte**. Resposta **(C)**.

