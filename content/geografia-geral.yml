    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: geopolitica
        source:
          exam: ENEM
          year: 2025
        prompt: |
          **Macedônia do Norte — Acordo entra em vigor e país muda oficialmente de nome**

          Entrou em vigor, em 2019, o acordo que determina a mudança de nome da Macedônia para Macedônia do Norte. A troca põe fim — ao menos por enquanto — no impasse entre essa antiga república da Iugoslávia e a vizinha Grécia. O governo grego se opunha ao uso do nome Macedônia pelo novo país vizinho porque a Grécia tem uma província no norte com o mesmo nome. Por causa desse impasse, a Grécia bloqueou as negociações de adesão de seu vizinho à União Europeia. Depois de negociações, as duas partes chegaram a um acordo.

          Disponível em: https://g1.globo.com. Acesso em: 7 nov. 2021 (adaptado).

          Para o país originado da antiga Iugoslávia, a mudança de nome é uma estratégia política para
        options:
        - text: "criar a moeda própria."
          correct: false
          feedback: "O bloco que o país quer integrar (UE) já tem o euro; a mudança de nome não cria moeda."
        - text: "proteger a cultura local."
          correct: false
          feedback: "A disputa é diplomática com a Grécia, não uma defesa da cultura interna."
        - text: "subjugar a minoria étnica."
          correct: false
          feedback: "O acordo resolve um impasse externo com a Grécia, não trata de minorias internas."
        - text: "expandir o território nacional."
          correct: false
          feedback: "Não há mudança territorial — apenas do nome do país."
        - text: "intensificar a integração regional."
          correct: true
        explanation: |
          A Grécia bloqueava a adesão do vizinho à União Europeia por causa do nome. Ao aceitar "Macedônia do Norte", o país remove o veto grego e destrava as negociações de adesão à UE (e à OTAN) — ou seja, a mudança de nome é uma estratégia para **intensificar a integração regional**. Resposta **(E)**.

