    title: Aula 1 — Cartografia
    description: Projeções, escalas, coordenadas, GPS e fusos horários.
    tags: [geografia-geral, cartografia]
    summary:
    - "Toda projeção distorce algo; a escolha depende do objetivo do mapa."
    - "A escala relaciona o mapa ao terreno: denominador maior significa menor escala e menos detalhe."
    - "Latitude e longitude localizam qualquer ponto; o GPS faz isso por satélites."
    - "Os fusos seguem a regra de 15° por hora a partir de Greenwich (UTC)."
