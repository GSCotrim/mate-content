  - slug: aula-8-era-vargas
    title: Aula 8 — Era Vargas e Estado Novo
    description: Revolução de 1930, Estado Novo, trabalhismo, CLT e industrialização de base.
    tags: [historia-brasil, era-vargas]
    summary:
    - "A Revolução de 1930 levou Vargas ao poder e encerrou a República Velha."
    - "A Era Vargas teve três fases: Provisório, Constitucional e Estado Novo."
    - "O Estado Novo (1937–1945) foi uma ditadura com censura, repressão e culto ao líder."
    - "Vargas consolidou o trabalhismo (CLT, 1943) com sindicatos atrelados ao Estado."
    - "Promoveu a industrialização de base (CSN, Vale) com forte papel do Estado."
