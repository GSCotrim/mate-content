  - slug: aula-7-primeira-republica
    title: Aula 7 — Primeira República (1889–1930)
    description: Coronelismo, café com leite, economia agroexportadora, movimento operário e as revoltas.
    tags: [historia-brasil, primeira-republica]
    summary:
    - "A Primeira República foi o governo das oligarquias agrárias (República Velha)."
    - "O poder se sustentava em coronelismo, política dos governadores e café com leite (SP–MG)."
    - "A economia seguiu agroexportadora, dependente do café, protegido pela valorização (Taubaté, 1906)."
    - "Operários e imigrantes organizaram greves; o Estado respondeu com repressão."
    - "Revoltas (Canudos, Contestado, Vacina, Chibata) e o tenentismo abalaram o regime."
    - "A Crise de 1929 e a quebra do pacto levaram à Revolução de 1930."
