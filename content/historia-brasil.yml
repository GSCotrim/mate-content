  - slug: aula-3-independencia-e-primeiro-reinado
    title: Aula 3 — Independência e Primeiro Reinado
    description: Vinda da corte, independência conservadora, Constituição de 1824 e crises do Primeiro Reinado.
    tags: [historia-brasil, independencia]
    summary:
    - "A vinda da corte (1808) abriu os portos e quebrou o pacto colonial."
    - "A independência (1822) foi conservadora: feita pela elite e mantendo escravidão e monarquia."
    - "O reconhecimento custou indenização a Portugal e pressão inglesa."
    - "A Constituição de 1824, outorgada, criou o Poder Moderador e o voto censitário."
    - "Crises levaram à abdicação de Dom Pedro I em 1831."
    blocks:
    - key: c1
      type: content
      markdownFile: historia-brasil/aula-3-independencia-e-primeiro-reinado/01-para-comecar.md

    - key: c2
      type: content
      markdownFile: historia-brasil/aula-3-independencia-e-primeiro-reinado/02-corte-no-brasil.md

    - key: ex1
      type: exercise
      exercise:
        type: multiple_choice
        difficulty: medium
        topic: independencia
        source:
          exam: ENEM
          year: 2025
        prompt: |
          A Impressão Régia do Rio de Janeiro foi criada pelo decreto de 13 de maio de 1808 para dar continuidade à nova sede do império português. A nova tipografia é criada em um momento no qual o projeto de reforma do império se transforma em um projeto de construção de um novo império português na América. Frente às tensões políticas que essa nova situação criava, a tipografia atuou na legitimação e sustentação daquele projeto político.

          BARRA, S. H. S. *A Impressão Régia do Rio de Janeiro e a colonização dos sertões na construção do novo império português na América (1808-1822)*. Topoi, n. 31, jul.-dez. 2015 (adaptado).

          A função política da tecnologia mencionada no texto favoreceu a nova sede do Império português por
        options:
        - text: "estabelecer as normativas ideológicas aos periódicos."
          correct: false
          feedback: "O foco é a sustentação do projeto imperial, não a censura aos jornais."
        - text: "propagar as diretrizes administrativas às capitanias."
          correct: false
          feedback: "A ênfase é a legitimação política do novo centro, não a mera comunicação administrativa."
        - text: "divulgar as conquistas às metrópoles europeias."
          correct: false
          feedback: "A corte estava no Brasil; a tipografia servia ao novo centro, não à Europa."
        - text: "integrar as regiões territoriais ao poder central."
          correct: true
        - text: "difundir as publicações às elites lusitanas."
          correct: false
          feedback: "O projeto voltava-se à construção do império na América, não às elites de Portugal."
        explanation: |
          Com a corte instalada no Rio, a Impressão Régia permitiu produzir e difundir leis, documentos e impressos que sustentavam o novo centro de poder na América. Ao alcançar o território, a tipografia ajudou a **integrar as regiões ao poder central**, legitimando o projeto imperial joanino. Resposta **(D)**.

    - key: c3
      type: content
      markdownFile: historia-brasil/aula-3-independencia-e-primeiro-reinado/03-processo-de-independencia.md

    - key: ph1
      type: exercise_placeholder
