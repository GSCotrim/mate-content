  - slug: aula-2-brasil-colonia
    title: Aula 2 — Brasil Colônia
    description: Açúcar, mineração, escravidão, jesuítas e bandeiras no sistema colonial.
    tags: [historia-brasil, brasil-colonia]
    summary:
    - "A colônia existia para enriquecer Portugal: monocultura, latifúndio e escravidão."
    - "O açúcar organizou o Nordeste em torno do engenho e da sociedade patriarcal."
    - "A escravidão africana foi o eixo do sistema; Palmares marcou a resistência."
    - "O ouro deslocou o eixo para o Centro-Sul, e as bandeiras ampliaram o território."
    - "Os jesuítas catequizaram e disputaram a mão de obra indígena até a expulsão por Pombal (1759)."
