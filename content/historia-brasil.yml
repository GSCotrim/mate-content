  - slug: aula-1-povos-indigenas-e-chegada-dos-europeus
    title: Aula 1 — Povos indígenas e a chegada dos europeus
    description: O território antes de 1500, a expansão marítima e o período pré-colonial.
    tags: [historia-brasil, indigenas-e-conquista]
    summary:
    - "O território já era habitado por milhões de indígenas de centenas de povos distintos."
    - "A expansão marítima nasceu do mercantilismo, da busca de especiarias e da centralização política."
    - "Tordesilhas (1494) dividiu o mundo entre Portugal e Espanha antes de Cabral."
    - "No período pré-colonial predominou o escambo do pau-brasil."
    - "O encontro foi violento: doenças, escravização e catequese dizimaram os povos originários."
