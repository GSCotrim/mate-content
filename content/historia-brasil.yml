  - slug: aula-9-republica-democratica-1946-1964
    title: Aula 9 — República democrática (1946–1964)
    description: Redemocratização, desenvolvimentismo de JK, crise política e o governo Jango.
    tags: [historia-brasil, republica-democratica]
    summary:
    - "A Constituição de 1946 restaurou a democracia; surgiram PSD, UDN e PTB."
    - "JK promoveu o desenvolvimentismo, o Plano de Metas e a construção de Brasília."
    - "O desenvolvimento gerou inflação, dívida e mais desigualdade regional."
    - "Jânio renunciou em 1961; Jango assumiu sob forte resistência."
    - "As Reformas de Base e a Guerra Fria polarizaram o país e prepararam o golpe."
