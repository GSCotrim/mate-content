  - slug: aula-5-segundo-reinado
    title: Aula 5 — Segundo Reinado
    description: Café, trabalho imigrante, leis abolicionistas, Lei Áurea e a crise final do Império.
    tags: [historia-brasil, segundo-reinado]
    summary:
    - "O café foi o motor do Segundo Reinado e deslocou o eixo para o Sudeste."
    - "A mão de obra passou do escravizado ao imigrante europeu, embutindo o branqueamento."
    - "A escravidão foi abolida por etapas, até a Lei Áurea (1888)."
    - "A Lei Áurea não ofereceu reparação — raiz da desigualdade racial atual."
    - "A monarquia caiu por perder o apoio de proprietários, Exército e Igreja."
