  - slug: aula-6-abolicao-e-proclamacao-da-republica
    title: Aula 6 — Proclamação da República
    description: O golpe de 1889, a República da Espada, a Constituição de 1891 e as continuidades do novo regime.
    tags: [historia-brasil, proclamacao-republica]
    summary:
    - "A Proclamação da República (1889) foi um golpe militar sem participação popular."
    - "Foi conduzida por militares positivistas e cafeicultores paulistas."
    - "A Constituição de 1891 trouxe presidencialismo, federalismo, Estado laico e voto excludente."
    - "A República foi mais continuidade que ruptura: manteve o latifúndio e a exclusão social."
    - "A população negra recém-liberta continuou à margem, aprofundando a desigualdade."
