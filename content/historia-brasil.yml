  - slug: aula-12-brasil-e-as-desigualdades
    title: Aula 12 — História do Brasil e as desigualdades
    description: Síntese das raízes históricas da desigualdade e a ponte argumentativa passado–presente do ENEM.
    tags: [historia-brasil, desigualdades]
    summary:
    - "A desigualdade brasileira foi construída historicamente, não é um acidente recente."
    - "Seus pilares: latifúndio, escravidão e abolição sem reparação, modernização excludente e exclusão política."
    - "A Lei de Terras (1850) fechou o acesso à terra justamente quando os escravizados se aproximavam da liberdade."
    - "O ENEM cobra a ponte entre causa histórica e consequência atual."
    - "A boa resposta contextualiza, conecta e não naturaliza a desigualdade."
