  - slug: aula-4-periodo-regencial
    title: Aula 4 — Período Regencial
    description: As regências, a disputa centralização × descentralização, as revoltas e o Golpe da Maioridade.
    tags: [historia-brasil, periodo-regencial]
    summary:
    - "O Período Regencial (1831–1840) foi o mais instável do Império."
    - "A disputa central foi entre descentralização (Ato Adicional de 1834) e centralização (Regresso de 1840)."
    - "Estouraram revoltas: Cabanagem, Balaiada, Sabinada, Farroupilha e a Revolta dos Malês."
    - "As revoltas revelaram a desigualdade e a exclusão profundas da sociedade imperial."
    - "O Golpe da Maioridade (1840) antecipou a coroação de Dom Pedro II."
